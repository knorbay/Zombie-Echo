name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build application
        run: pyinstaller --noconfirm ZombieEcho.spec

      - name: Package application
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Zombie Echo.app" "Zombie-Echo-macOS.zip"

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Zombie-Echo-macOS
          path: Zombie-Echo-macOS.zip
          if-no-files-found: error
          retention-days: 14
